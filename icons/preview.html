<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Flaer — Dashboard Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#07110f;color:#f4f7f5;padding:48px;-webkit-font-smoothing:antialiased;}
h1{font-size:28px;font-weight:900;letter-spacing:-.055em;margin-bottom:6px;}
h1 span{color:#2cad84;}
p{color:rgba(244,247,245,0.46);font-size:13px;margin-bottom:36px;}
.grid{display:flex;flex-wrap:wrap;gap:20px;}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);width:130px;transition:.16s;}
.card:hover{background:rgba(255,255,255,0.07);transform:translateY(-2px);}
.card img{width:64px;height:64px;border-radius:14px;}
.card span{font-size:11px;font-weight:700;color:rgba(244,247,245,0.5);text-align:center;line-height:1.4;}
.sizes{display:flex;gap:8px;align-items:center;margin-top:4px;}
.sz{width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);}
.section{margin-bottom:40px;}
.section-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,247,245,0.28);margin-bottom:16px;}
</style>
</head>
<body>
<h1>fl<span>ae</span>r — Dashboard Icons</h1>
<p>12 icons · 128×128 px · PNG · Dark mode · Flaer brand palette</p>

<div class="section">
  <div class="section-label">Navigation icons</div>
  <div class="grid">
    <div class="card"><img src="portfolio.png"/><span>Portfolio Review</span></div>
    <div class="card"><img src="forecast.png"/><span>10yr Forecast</span></div>
    <div class="card"><img src="actions.png"/><span>Recommended Actions</span></div>
    <div class="card"><img src="analytics.png"/><span>Facility Analytics</span></div>
    <div class="card"><img src="benchmark.png"/><span>Benchmark</span></div>
    <div class="card"><img src="calculator.png"/><span>Carbon Calculator</span></div>
    <div class="card"><img src="globalmap.png"/><span>Global Map</span></div>
    <div class="card"><img src="siteiq.png"/><span>Site Intelligence</span></div>
  </div>
</div>

<div class="section">
  <div class="section-label">UI action icons</div>
  <div class="grid">
    <div class="card"><img src="export.png"/><span>Export PDF</span></div>
    <div class="card"><img src="alert.png"/><span>Alert / Warning</span></div>
    <div class="card"><img src="settings.png"/><span>Settings</span></div>
    <div class="card"><img src="share.png"/><span>Share</span></div>
  </div>
</div>
</body>
</html>
